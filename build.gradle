plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.gloryoutput'
version = '0.0.1-SNAPSHOT'
description = 'docs-generator'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.1.0.202411261347-r'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootRun 실행 전 8080 포트를 사용 중인 프로세스를 종료
tasks.named('bootRun') {
    doFirst {
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            def result = new ByteArrayOutputStream()
            project.exec {
                commandLine 'cmd', '/c', 'netstat -ano | findstr :8080 | findstr LISTENING'
                standardOutput = result
                ignoreExitValue = true
            }
            result.toString().eachLine { line ->
                def parts = line.trim().split(/\s+/)
                if (parts.length >= 5) {
                    def pid = parts[4]
                    project.exec {
                        commandLine 'cmd', '/c', "taskkill /F /PID ${pid}"
                        ignoreExitValue = true
                    }
                    println "Killed process on port 8080 (PID: ${pid})"
                }
            }
        } else {
            project.exec {
                commandLine 'bash', '-c', "lsof -ti:8080 | xargs -r kill -9"
                ignoreExitValue = true
            }
        }
    }
}
