spring:
  application:
    name: docs-generator
  profiles:
    active: dev
app:
  encryption:
    key: ${ENCRYPTION_KEY:docs-generator-default-key-32ch}
  llm:
    enabled: ${LLM_ENABLED:false}
    provider: ${LLM_PROVIDER:openai}
    api-url: ${LLM_API_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
# 개발 환경: H2 인메모리 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:reportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

---
# 로컬 MySQL 환경
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/reportdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:docs}
    password: ${DB_PASSWORD:docs123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
# 운영 환경: MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3307/reportdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
